<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WanderLog - Edit Route</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --ink: #1a1714;
    --ink-muted: #6b6560;
    --ink-faint: #b0aba5;
    --paper: #faf8f4;
    --paper-warm: #f3efe8;
    --paper-card: #ffffff;
    --accent: #c4773a;
    --accent-light: #f5e8d8;
    --accent-dark: #8a4f22;
    --teal: #2d7d6f;
    --red: #c44a3a;
    --green: #4cd68a;
    --border: rgba(26,23,20,0.11);
    --border-med: rgba(26,23,20,0.22);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1, h2, h3 { margin: 0; }
  button { font-family: inherit; cursor: pointer; }

  #center-msg {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .msg-card {
    background: var(--paper-card); border-radius: 20px; padding: 32px 28px;
    max-width: 420px; width: 100%; box-shadow: 0 8px 24px rgba(26,23,20,0.15);
    text-align: center;
  }
  .msg-card h1 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .msg-card p { color: var(--ink-muted); font-size: 14px; line-height: 1.5; margin: 0; }
  .msg-card .big-icon { font-size: 40px; margin-bottom: 12px; }

  #app { display: flex; flex-direction: column; height: 100vh; }

  header.app-header {
    background: var(--ink); color: var(--paper); padding: 12px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  header.app-header h1 { font-size: 16px; font-weight: 700; }
  header.app-header .sub { color: rgba(250,248,244,0.55); font-size: 11px; margin-top: 2px; }

  #banner {
    background: var(--paper-card); border-bottom: 1px solid var(--border);
    padding: 10px 18px; font-size: 13px; line-height: 1.4; color: var(--ink);
  }
  #banner .status { color: var(--red); font-weight: 600; margin-top: 4px; font-size: 12px; min-height: 15px; }
  #banner .mode-indicator {
    display: none; margin-top: 6px; font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px;
  }
  #banner .mode-indicator.trail { display: inline-block; background: rgba(76,214,138,0.18); color: #2e9e63; }
  #banner .mode-indicator.manual { display: inline-block; background: rgba(196,74,58,0.15); color: var(--red); }
  #adjusted-count { margin-top: 4px; font-size: 11px; color: var(--ink-muted); display: none; }

  #map { flex: 1; min-height: 0; background: var(--paper-warm); }

  #toolbar {
    background: var(--paper-card); border-top: 1px solid var(--border);
    padding: 12px 18px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  button.wl-btn {
    border: none; border-radius: 999px; padding: 11px 18px; font-size: 13px; font-weight: 600;
    color: #fff; background: var(--accent);
  }
  button.wl-btn.secondary { background: var(--paper-warm); color: var(--ink); border: 1px solid var(--border-med); }
  button.wl-btn.danger { background: var(--red); }
  button.wl-btn:disabled { opacity: 0.45; cursor: default; }
  .hidden { display: none !important; }

  .wl-wp-dot { width: 12px; height: 12px; border-radius: 6px; background: var(--accent); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
  .wl-drag-dot { width: 14px; height: 14px; border-radius: 7px; background: #fff; border: 3px solid var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.4); cursor: grab; }

  #save-toast {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 12px 20px; border-radius: 12px;
    font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 2000; display: none;
    max-width: 90vw; text-align: center;
  }
  #save-toast.show { display: block; }

  #busy-overlay {
    position: fixed; inset: 0; background: rgba(26,23,20,0.35); z-index: 1500;
    display: none; align-items: center; justify-content: center;
  }
  #busy-overlay.show { display: flex; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.4); border-top-color: #fff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="center-msg" class="hidden">
  <div class="msg-card">
    <div class="big-icon" id="msg-icon">🧭</div>
    <h1 id="msg-title"></h1>
    <p id="msg-body"></p>
  </div>
</div>

<div id="app" class="hidden">
  <header class="app-header">
    <div>
      <h1>Edit Route</h1>
      <div class="sub" id="session-sub"></div>
    </div>
  </header>

  <div id="banner">
    <div id="banner-text">Loading route…</div>
    <div class="status" id="status"></div>
    <div class="mode-indicator" id="mode-indicator"></div>
    <div id="adjusted-count"></div>
  </div>

  <div id="map"></div>

  <div id="toolbar">
    <div id="tb-idle">
      <button class="wl-btn" onclick="startDrawing()">Draw Correct Route</button>
      <button class="wl-btn" onclick="startAddingSection()">Add Section</button>
      <button class="wl-btn secondary" id="btn-adjust" onclick="toggleAdjustPoints()">Adjust Points</button>
      <button class="wl-btn secondary" onclick="resetToGps()">Reset to GPS</button>
      <button class="wl-btn" id="btn-save" onclick="saveRoute()" style="display:none;">Save Correction</button>
    </div>
    <div id="tb-drawing" class="hidden">
      <button class="wl-btn secondary" onclick="undoLast()">Undo</button>
      <button class="wl-btn secondary" onclick="clearDrawing()">Clear</button>
      <button class="wl-btn" onclick="finishDrawing()">Done</button>
    </div>
    <div id="tb-review" class="hidden">
      <button class="wl-btn secondary" onclick="reviewNo()">No</button>
      <button class="wl-btn" onclick="reviewYes()">Yes, Replace</button>
    </div>
    <div id="tb-insert" class="hidden">
      <button class="wl-btn secondary" onclick="cancelInsert()">Cancel</button>
      <button class="wl-btn secondary" onclick="insertSection('beginning')">Beginning</button>
      <button class="wl-btn secondary" onclick="insertSection('nearest')">Nearest Point</button>
      <button class="wl-btn" onclick="insertSection('end')">End</button>
    </div>
  </div>
</div>

<div id="save-toast"></div>
<div id="busy-overlay"><div class="spinner"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://fqqgozzvbuswzpstgtec.supabase.co';
  var ANON_KEY = 'sb_publishable_5zLoOgaVe_-apwQssTjuJQ_c9JGem0u';
  var GRAPHHOPPER_KEY = '323af813-dfca-4a45-b89d-13461e7af8ed';
  var GRAPHHOPPER_PROFILE = 'foot'; // this account tier only allows car/bike/foot

  var sessionId = new URLSearchParams(location.search).get('session');

  var els = {
    centerMsg: document.getElementById('center-msg'),
    msgIcon: document.getElementById('msg-icon'),
    msgTitle: document.getElementById('msg-title'),
    msgBody: document.getElementById('msg-body'),
    app: document.getElementById('app'),
    sessionSub: document.getElementById('session-sub'),
    bannerText: document.getElementById('banner-text'),
    status: document.getElementById('status'),
    modeIndicator: document.getElementById('mode-indicator'),
    adjustedCount: document.getElementById('adjusted-count'),
    btnSave: document.getElementById('btn-save'),
    btnAdjust: document.getElementById('btn-adjust'),
    saveToast: document.getElementById('save-toast'),
    busyOverlay: document.getElementById('busy-overlay'),
  };

  function showCenterMessage(icon, title, body) {
    els.centerMsg.classList.remove('hidden');
    els.app.classList.add('hidden');
    els.msgIcon.textContent = icon;
    els.msgTitle.textContent = title;
    els.msgBody.textContent = body;
  }

  function setBusy(on) {
    els.busyOverlay.classList.toggle('show', !!on);
  }

  function showToast(msg, ms) {
    els.saveToast.textContent = msg;
    els.saveToast.classList.add('show');
    setTimeout(function () { els.saveToast.classList.remove('show'); }, ms || 4000);
  }

  if (!sessionId) {
    showCenterMessage('⚠️', 'Missing edit link', 'This link is missing a session id. Generate a new one from the "Edit on Desktop" button in the WanderLog app.');
    return;
  }

  function rest(path, init) {
    return fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({
      headers: Object.assign({
        apikey: ANON_KEY,
        Authorization: 'Bearer ' + ANON_KEY,
        'Content-Type': 'application/json',
      }, (init && init.headers) || {}),
    }, init || {})).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) { throw new Error(t || ('Request failed (' + res.status + ')')); });
      }
      if (res.status === 204) return null;
      return res.json();
    });
  }

  function fetchSession() {
    return rest('desktop_edit_sessions?id=eq.' + encodeURIComponent(sessionId) + '&select=*')
      .then(function (rows) {
        if (!rows || rows.length === 0) return null;
        return rows[0];
      });
  }

  function saveSession(correctedPoints) {
    return rest('desktop_edit_sessions?id=eq.' + encodeURIComponent(sessionId), {
      method: 'PATCH',
      headers: { Prefer: 'return=minimal' },
      body: JSON.stringify({ corrected_points: correctedPoints, status: 'completed' }),
    });
  }

  // ── State ────────────────────────────────────────────────────────────────

  var originalRoute = []; // [[lat,lng], ...] - the real recorded GPS, never mutated
  var workingRoute = [];  // the route actually being edited - this is the one "Save" writes out
  var addedSectionRanges = []; // [{start,end}] index ranges of workingRoute added via "Add Section"
  var hasChanges = false;
  var movedIndices = {};

  var map, originalLayer, workingLayer, sectionLayers = [], drawLayer, previewLayer;
  var waypointMarkers = [];
  var segments = []; // [{ point:[lat,lng], path:[[lat,lng],...], segMode }]
  var mode = 'idle'; // idle | drawing | review | inserting
  var routingMode = null; // 'trail' | 'manual' | null
  var drawTarget = null; // 'correction' | 'section' | null

  var adjustActive = false;
  var adjustMarkers = [];

  function haversineMeters(lat1, lng1, lat2, lng2) {
    var R = 6371000;
    var toRad = function (d) { return (d * Math.PI) / 180; };
    var dLat = toRad(lat2 - lat1);
    var dLng = toRad(lng2 - lng1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  async function graphhopperRoute(coordsList) {
    var params = coordsList.map(function (c) {
      return 'point=' + encodeURIComponent(c[0] + ',' + c[1]);
    }).join('&');
    var url = 'https://graphhopper.com/api/1/route?' + params +
      '&profile=' + GRAPHHOPPER_PROFILE + '&points_encoded=false&locale=en&key=' + GRAPHHOPPER_KEY;
    var res = await fetch(url);
    if (!res.ok) throw new Error('GraphHopper request failed (' + res.status + ')');
    var data = await res.json();
    if (!data.paths || !data.paths.length) throw new Error(data.message || 'No trail found between those points');
    return data.paths[0].points.coordinates.map(function (c) { return [c[1], c[0]]; });
  }

  async function graphhopperNearest(lat, lng) {
    var url = 'https://graphhopper.com/api/1/nearest?point=' + lat + ',' + lng + '&key=' + GRAPHHOPPER_KEY;
    var res = await fetch(url);
    if (!res.ok) throw new Error('nearest request failed (' + res.status + ')');
    var data = await res.json();
    if (!data.coordinates || data.coordinates.length < 2 || typeof data.distance !== 'number') {
      throw new Error('unexpected /nearest response shape');
    }
    return { point: [data.coordinates[1], data.coordinates[0]], distance: data.distance };
  }

  // ── Rendering ────────────────────────────────────────────────────────────

  function renderOriginal() {
    if (originalLayer) map.removeLayer(originalLayer);
    if (originalRoute.length > 1) {
      originalLayer = L.polyline(originalRoute, { color: '#3388ff', weight: 3, opacity: 0.65 }).addTo(map);
    }
  }

  function renderWorking() {
    if (workingLayer) map.removeLayer(workingLayer);
    sectionLayers.forEach(function (l) { map.removeLayer(l); });
    sectionLayers = [];
    if (workingRoute.length < 2) return;

    var greenRanges = mergeRanges(addedSectionRanges);
    if (greenRanges.length === 0) {
      workingLayer = L.polyline(workingRoute, { color: '#c4773a', weight: 5 }).addTo(map);
      return;
    }
    // Draw the base line in accent, then overlay green highlight ranges on top.
    workingLayer = L.polyline(workingRoute, { color: '#c4773a', weight: 5 }).addTo(map);
    greenRanges.forEach(function (r) {
      var start = Math.max(r.start, 0);
      var end = Math.min(r.end, workingRoute.length - 1);
      if (end > start) {
        sectionLayers.push(L.polyline(workingRoute.slice(start, end + 1), { color: '#4cd68a', weight: 5 }).addTo(map));
      }
    });
  }

  function mergeRanges(ranges) {
    if (!ranges.length) return [];
    var sorted = ranges.slice().sort(function (a, b) { return a.start - b.start; });
    var merged = [{ start: sorted[0].start, end: sorted[0].end }];
    for (var i = 1; i < sorted.length; i++) {
      var last = merged[merged.length - 1];
      var cur = sorted[i];
      if (cur.start <= last.end + 1) last.end = Math.max(last.end, cur.end);
      else merged.push({ start: cur.start, end: cur.end });
    }
    return merged;
  }

  function renderDrawing() {
    if (drawLayer) { map.removeLayer(drawLayer); drawLayer = null; }
    var full = fullDrawnPath();
    if (full.length > 1) {
      var color = drawTarget === 'section' ? '#4cd68a' : '#c4773a';
      drawLayer = L.polyline(full, { color: color, weight: 5, dashArray: '2,8' }).addTo(map);
    }
  }

  function fullDrawnPath() {
    var full = [];
    segments.forEach(function (s) { full = full.concat(s.path); });
    return full;
  }

  // ── UI state ─────────────────────────────────────────────────────────────

  function showToolbar(which) {
    ['tb-idle', 'tb-drawing', 'tb-review', 'tb-insert'].forEach(function (id) {
      document.getElementById(id).classList.toggle('hidden', id !== which);
    });
  }

  function setStatus(msg) { els.status.textContent = msg || ''; }

  function updateBanner() {
    if (mode === 'idle') {
      els.bannerText.textContent = 'Draw a correction, add a missing section, or drag points into place. Bigger screen, same tools as the app.';
      showToolbar('tb-idle');
    } else if (mode === 'drawing') {
      els.bannerText.textContent = drawTarget === 'section'
        ? 'Click the start, then waypoints, then the end of the missing section.'
        : 'Click along the path you actually travelled.';
      showToolbar('tb-drawing');
    } else if (mode === 'review') {
      els.bannerText.textContent = 'Replace the current route with your correction?';
      showToolbar('tb-review');
    } else if (mode === 'inserting') {
      els.bannerText.textContent = 'Where should this new section go?';
      showToolbar('tb-insert');
    }
  }

  function updateModeIndicator() {
    var el = els.modeIndicator;
    if (routingMode === 'trail') {
      el.textContent = '🥾 Following trail';
      el.className = 'mode-indicator trail';
    } else if (routingMode === 'manual') {
      el.textContent = '✋ Manual segment (no trail found)';
      el.className = 'mode-indicator manual';
    } else {
      el.textContent = '';
      el.className = 'mode-indicator';
    }
  }

  function updateSaveVisibility() {
    els.btnSave.style.display = hasChanges ? 'inline-block' : 'none';
  }

  function updateAdjustedCount() {
    var n = Object.keys(movedIndices).length;
    if (n === 0) {
      els.adjustedCount.style.display = 'none';
      els.adjustedCount.textContent = '';
    } else {
      els.adjustedCount.style.display = 'block';
      els.adjustedCount.textContent = n + (n === 1 ? ' point adjusted' : ' points adjusted');
    }
  }

  function addWaypointMarker(pt) {
    var m = L.marker(pt, { icon: L.divIcon({ className: '', html: '<div class="wl-wp-dot"></div>', iconSize: [12, 12], iconAnchor: [6, 6] }) }).addTo(map);
    waypointMarkers.push(m);
  }

  function startDrawing() {
    if (adjustActive) toggleAdjustPoints();
    mode = 'drawing';
    drawTarget = 'correction';
    setStatus('');
    updateBanner();
  }

  function startAddingSection() {
    if (adjustActive) toggleAdjustPoints();
    clearDrawing();
    mode = 'drawing';
    drawTarget = 'section';
    setStatus('');
    updateBanner();
  }

  async function addWaypoint(pt) {
    addWaypointMarker(pt);

    if (segments.length === 0) {
      segments.push({ point: pt, path: [pt] });
      renderDrawing();
      return;
    }

    var prevPoint = segments[segments.length - 1].point;
    var seg = { point: pt, path: [prevPoint, pt], segMode: 'manual' };
    segments.push(seg);
    renderDrawing();

    try {
      seg.path = await graphhopperRoute([prevPoint, pt]);
      seg.segMode = 'trail';
      routingMode = 'trail';
    } catch (e) {
      routingMode = 'manual';
    }
    updateModeIndicator();
    renderDrawing();
  }

  function undoLast() {
    if (!segments.length) return;
    segments.pop();
    var m = waypointMarkers.pop();
    if (m) map.removeLayer(m);
    var last = segments[segments.length - 1];
    routingMode = last ? (last.segMode || null) : null;
    updateModeIndicator();
    renderDrawing();
  }

  function clearDrawing() {
    segments = [];
    waypointMarkers.forEach(function (m) { map.removeLayer(m); });
    waypointMarkers = [];
    routingMode = null;
    updateModeIndicator();
    renderDrawing();
    setStatus('');
  }

  function finishDrawing() {
    if (segments.length < 2) {
      setStatus('Click at least two points to draw a route.');
      return;
    }
    mode = (drawTarget === 'section') ? 'inserting' : 'review';
    setStatus('');
    updateBanner();
  }

  function reviewYes() {
    workingRoute = fullDrawnPath();
    addedSectionRanges = [];
    hasChanges = true;
    clearDrawing();
    drawTarget = null;
    mode = 'idle';
    updateBanner();
    updateSaveVisibility();
    rebuildAdjustMarkersIfActive();
    renderWorking();
  }

  function reviewNo() {
    clearDrawing();
    drawTarget = null;
    mode = 'idle';
    updateBanner();
  }

  function cancelInsert() {
    clearDrawing();
    drawTarget = null;
    mode = 'idle';
    updateBanner();
  }

  function shiftRangesFrom(atIndex, by) {
    addedSectionRanges = addedSectionRanges.map(function (r) {
      if (r.start >= atIndex) return { start: r.start + by, end: r.end + by };
      return r;
    });
  }

  function insertSection(where) {
    var sectionPath = fullDrawnPath();
    if (where === 'beginning') {
      shiftRangesFrom(0, sectionPath.length);
      workingRoute = sectionPath.concat(workingRoute);
      addedSectionRanges.push({ start: 0, end: sectionPath.length - 1 });
    } else if (where === 'end') {
      var startAtEnd = workingRoute.length;
      workingRoute = workingRoute.concat(sectionPath);
      addedSectionRanges.push({ start: startAtEnd, end: workingRoute.length - 1 });
    } else {
      var firstEnd = sectionPath[0];
      var lastEnd = sectionPath[sectionPath.length - 1];
      var bestIdx = 0, bestDist = Infinity, bestReversed = false;
      for (var i = 0; i < workingRoute.length; i++) {
        var wp = workingRoute[i];
        var dFirst = haversineMeters(wp[0], wp[1], firstEnd[0], firstEnd[1]);
        var dLast = haversineMeters(wp[0], wp[1], lastEnd[0], lastEnd[1]);
        if (dFirst < bestDist) { bestDist = dFirst; bestIdx = i; bestReversed = false; }
        if (dLast < bestDist) { bestDist = dLast; bestIdx = i; bestReversed = true; }
      }
      var pathToInsert = bestReversed ? sectionPath.slice().reverse() : sectionPath;
      var insertAt = bestIdx + 1;
      shiftRangesFrom(insertAt, pathToInsert.length);
      workingRoute = workingRoute.slice(0, insertAt).concat(pathToInsert, workingRoute.slice(insertAt));
      addedSectionRanges.push({ start: insertAt, end: insertAt + pathToInsert.length - 1 });
    }

    hasChanges = true;
    clearDrawing();
    drawTarget = null;
    mode = 'idle';
    updateBanner();
    updateSaveVisibility();
    rebuildAdjustMarkersIfActive();
    renderWorking();
  }

  function toggleAdjustPoints() {
    adjustActive = !adjustActive;
    els.btnAdjust.classList.toggle('secondary', !adjustActive);
    if (adjustActive) buildAdjustMarkers();
    else clearAdjustMarkers();
  }

  function rebuildAdjustMarkersIfActive() {
    if (adjustActive) buildAdjustMarkers();
  }

  function clearAdjustMarkers() {
    adjustMarkers.forEach(function (am) { map.removeLayer(am.marker); });
    adjustMarkers = [];
    if (previewLayer) { map.removeLayer(previewLayer); previewLayer = null; }
  }

  // A desktop browser can comfortably handle more markers than the app's
  // WebView, but a multi-thousand-point journey still doesn't need a handle
  // on every single point - cap it and let "trail" snapping fill in the rest.
  function buildAdjustMarkers() {
    clearAdjustMarkers();
    var n = workingRoute.length;
    if (n === 0) return;
    var step = Math.max(1, Math.ceil(n / 300));
    var indices = [];
    for (var i = 0; i < n; i += step) indices.push(i);
    if (indices[indices.length - 1] !== n - 1) indices.push(n - 1);

    indices.forEach(function (idx) {
      var pt = workingRoute[idx];
      var marker = L.marker(pt, {
        draggable: true,
        icon: L.divIcon({ className: '', html: '<div class="wl-drag-dot"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }),
      }).addTo(map);

      marker.on('drag', function (e) {
        var ll = e.target.getLatLng();
        var prev = idx > 0 ? workingRoute[idx - 1] : null;
        var next = idx < workingRoute.length - 1 ? workingRoute[idx + 1] : null;
        var path = [];
        if (prev) path.push(prev);
        path.push([ll.lat, ll.lng]);
        if (next) path.push(next);
        if (previewLayer) map.removeLayer(previewLayer);
        previewLayer = L.polyline(path, { color: '#c4773a', weight: 3, dashArray: '6,5' }).addTo(map);
      });
      marker.on('dragend', function (e) {
        var ll = e.target.getLatLng();
        finishPointDrag(idx, [ll.lat, ll.lng], marker);
      });

      adjustMarkers.push({ marker: marker, idx: idx });
    });
  }

  async function finishPointDrag(idx, dropped, marker) {
    var finalPt = dropped;
    try {
      var snapped = await graphhopperNearest(dropped[0], dropped[1]);
      if (snapped && snapped.distance <= 50) finalPt = snapped.point;
    } catch (e) {
      // /nearest unavailable or too far from a road - keep the dropped position.
    }
    workingRoute[idx] = finalPt;
    marker.setLatLng(finalPt);
    movedIndices[idx] = true;
    if (previewLayer) { map.removeLayer(previewLayer); previewLayer = null; }
    hasChanges = true;
    updateAdjustedCount();
    updateSaveVisibility();
    renderWorking();
  }

  function resetToGps() {
    if (!confirm('Discard all changes and reset to the original recorded GPS track?')) return;
    workingRoute = originalRoute.map(function (p) { return p.slice(); });
    addedSectionRanges = [];
    movedIndices = {};
    hasChanges = false;
    if (adjustActive) toggleAdjustPoints();
    updateSaveVisibility();
    updateAdjustedCount();
    renderWorking();
  }

  async function saveRoute() {
    setBusy(true);
    try {
      var points = workingRoute.map(function (p) { return { lat: p[0], lng: p[1] }; });
      await saveSession(points);
      showToast('Saved! Go back to the WanderLog app and tap "Sync from Desktop".', 6000);
      hasChanges = false;
      updateSaveVisibility();
    } catch (e) {
      alert('Could not save: ' + (e.message || e));
    } finally {
      setBusy(false);
    }
  }

  window.startDrawing = startDrawing;
  window.startAddingSection = startAddingSection;
  window.toggleAdjustPoints = toggleAdjustPoints;
  window.resetToGps = resetToGps;
  window.saveRoute = saveRoute;
  window.undoLast = undoLast;
  window.clearDrawing = clearDrawing;
  window.finishDrawing = finishDrawing;
  window.reviewYes = reviewYes;
  window.reviewNo = reviewNo;
  window.cancelInsert = cancelInsert;
  window.insertSection = insertSection;

  // ── Boot ─────────────────────────────────────────────────────────────────

  fetchSession().then(function (row) {
    if (!row) {
      showCenterMessage('⚠️', 'Link not found', 'This edit link has expired or no longer exists. Generate a new one from the "Edit on Desktop" button in the WanderLog app.');
      return;
    }

    originalRoute = (row.original_points || []).map(function (p) { return [p.lat, p.lng]; });
    if (originalRoute.length < 2) {
      showCenterMessage('⚠️', 'Not enough GPS data', 'This journey does not have enough recorded points to edit.');
      return;
    }
    workingRoute = (row.corrected_points && row.corrected_points.length)
      ? row.corrected_points.map(function (p) { return [p.lat, p.lng]; })
      : originalRoute.map(function (p) { return p.slice(); });

    els.sessionSub.textContent = row.status === 'completed'
      ? 'A correction was already saved for this journey - editing again will overwrite it.'
      : 'Editing the recorded GPS track for this journey.';

    els.centerMsg.classList.add('hidden');
    els.app.classList.remove('hidden');

    map = L.map('map', { zoomControl: true }).fitBounds(L.latLngBounds(originalRoute), { padding: [30, 30] });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);

    map.on('click', function (e) {
      if (mode !== 'drawing') return;
      addWaypoint([e.latlng.lat, e.latlng.lng]);
    });

    renderOriginal();
    renderWorking();
    updateBanner();
    updateSaveVisibility();
    updateAdjustedCount();
  }).catch(function (e) {
    showCenterMessage('⚠️', 'Could not load this session', e.message || 'Please check your connection and try again.');
  });
})();
</script>
</body>
</html>
